# Default Railway service from monorepo root → voice-gateway
# (OpenAI webhook / Twilio). For Admin UI create a 2nd service with
# Root Directory = RegnerWerk-Backend.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
